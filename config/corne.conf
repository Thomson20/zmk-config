# Uncomment the following lines to enable the Corne RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y

# Uncomment the following line to enable Bongo Cat
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y
# CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
# CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT_ANIMATION_MS

CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

CONFIG_ZMK_POINTING=y

# =====================================
# POWER MANAGEMENT
# =====================================

# Enter idle after 30 seconds
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Deep sleep after 15 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# =====================================
# OLED DISPLAY
# =====================================

# Keep OLED enabled
CONFIG_ZMK_DISPLAY=y

# Turn off OLED when idle
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# =====================================
# RGB LIGHTING
# =====================================

# Turn RGB off when idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Turn RGB off when USB disconnected
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y

# Start with RGB disabled
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Reduce starting brightness
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10